const clients='<div class="client-grid"><a href="#/clients/sean" class="client"><span class="eyebrow">01 / Recording artist</span><strong>SĒAN<br>MOSIKILI</strong><div class="bottom"><span>Artist identity & positioning</span><span>↗</span></div></a><a href="#/clients/saint" class="client"><span class="eyebrow">02 / Digital creator</span><strong>$AINT<br>F.CLOUD</strong><div class="bottom"><span>Creator positioning & partnerships</span><span>↗</span></div></a></div>';
const articles=[{id:'adela',name:'ADÉLA',title:'The anatomy of a pop arrival',type:'Artist positioning',deck:'A distinctive visual language is not an accessory to an artist. It is part of how an audience learns to recognise them.',paragraphs:['In a crowded pop landscape, recognition is built through repetition with intention. A recurring aesthetic, a recognisable point of view and a coherent public presence can make a new artist feel culturally legible before the audience knows every song.','ADÉLA offers an interesting lens for considering how a pop identity becomes more than a collection of releases. The public-facing world around an artist creates expectations: how they move, what they reference and why an audience should pay attention.','Visibility alone does not create a lasting era. What matters is whether attention connects to a compelling identity and an evolving body of work.'],quote:'An era begins when an audience can recognise the world before they are told its name.'},{id:'max',name:'MAX',title:'Visibility is not the whole strategy',type:'Public perception',deck:'A recognisable artist can have the audience, the music and the infrastructure, yet still face a positioning challenge.',paragraphs:['Awareness and momentum are different things. An artist may have significant reach and an established catalogue without every release becoming a defining cultural moment.','The interesting question is not simply whether people have heard of the artist. It is what they associate with that name, how clearly the current artistic proposition is communicated and whether the public-facing narrative gives audiences a reason to re-engage.','Distribution and exposure are powerful, but neither replaces an identity that feels specific, timely and emotionally compelling.'],quote:'Being seen is one thing. Being understood, remembered and sought out is another.'}];
const profile=(name,category,description,scope)=>'<section class="page-hero shell"><p class="eyebrow">THE ROSTER / '+category+'</p><h1 class="display">'+name+'</h1><p class="lead">'+description+'</p></section><section class="section shell dark">'+head('Our involvement','SELECTED SCOPE')+'<div class="split"><h2 class="display">A distinct<br><em>point of view.</em></h2><div><p class="copy">'+scope+'</p><a class="link" href="#/contact">Representation enquiries ↗</a></div></div></section>';

'/':'<section class="hero shell"><div class="eyebrow">Brand strategy / Public relations / Creative direction</div><h1>Perception,<br><em>considered.</em></h1><div class="hero-bottom"><p>We shape the identities, narratives and cultural presence of artists and creatives.</p><a class="link" href="#/expertise">Enter the office ↗</a></div></section><section class="section shell">'+head('The Office','001 — PHILOSOPHY')+'<div class="split"><h2 class="display">Identity is<br>everything.</h2><div><p class="copy">A strategy-led practice at the intersection of image, influence and culture. We build more than visibility. We build the reasons people remember.</p><a class="link" href="#/expertise">Our approach ↗</a></div></div></section><section class="section shell dark">'+head('What we do','002 — PRACTICE')+'<h2 class="display">The art of<br><em>being known.</em></h2>'+services+'</section><section class="section shell">'+head('Selected roster','003 — REPRESENTATION')+clients+'</section><section class="section shell dark">'+head('Editorial intelligence','004 — PERSPECTIVES')+'<div class="split"><h2 class="display">The Anatomy<br>of <em>an Era.</em></h2><div><p class="copy">Decoding the identities, cultural signals and public narratives behind the artists shaping conversation.</p><p class="copy">Our perspective is public. Our playbook is not.</p><a class="link" href="#/anatomy">Read the series ↗</a></div></div></section>',
'/expertise':'<section class="page-hero shell"><p class="eyebrow">01 / OUR EXPERTISE</p><h1 class="display">Image is<br><em>intentional.</em></h1><p class="lead">Strategy first. Every expression, considered.</p></section><section class="section shell dark">'+head('Our practice','THREE DISCIPLINES')+services+'</section><section class="section shell">'+head('The distinction','THE IDENTITY OFFICE™')+'<div class="split"><h2 class="display">Not louder.<br><em>Clearer.</em></h2><div><p class="copy">We connect positioning, storytelling and visual direction into a public identity that feels unmistakably yours.</p><a class="link" href="#/contact">Discuss a project ↗</a></div></div></section>',
'/clients':'<section class="page-hero shell"><p class="eyebrow">02 / THE ROSTER</p><h1 class="display">The people<br><em>we position.</em></h1><p class="lead">Distinct voices. Deliberate identities.</p></section><section class="section shell">'+head('Current clients','002')+clients+'</section>',
'/clients/sean':profile('SĒAN<br>MOSIKILI','Recording artist / Singer · Songwriter · Producer','Contemporary pop, alternative R&B and electronic expression. Emotional precision, atmospheric production and evolving visual identity.','Artist positioning · Narrative development · Creative identity'),
'/clients/saint':profile('$AINT<br>F.CLOUD','Digital creator / Fashion · Lifestyle · Storytelling','An unfiltered voice with a distinctive point of view across fashion, culture and everyday storytelling.','Creator positioning · Brand partnerships · Public relations'),
'/anatomy':'<section class="page-hero shell"><p class="eyebrow">03 / EDITORIAL SERIES</p><h1 class="display">The Anatomy<br>of <em>an Era.</em></h1><p class="lead">An editorial examination of artist identity, cultural positioning and the mechanics of perception. Insight, not the entire blueprint.</p></section><section class="section shell">'+head('The archive','PUBLIC PERSPECTIVES')+articles.map((a,i)=>'<a class="editorial" href="#/anatomy/'+a.id+'"><small>0'+(i+1)+'</small><h3>'+a.name+'<br><em>'+a.title+'</em></h3><small class="type">'+a.type+'</small><span>↗</span></a>').join('')+'<p class="note" style="margin-top:35px">Independent editorial commentary. No affiliation with featured artists is implied.</p></section>',
'/contact':'<section class="page-hero shell"><p class="eyebrow">04 / ENQUIRIES</p><h1 class="display">The next era<br><em>starts here.</em></h1></section><section class="section shell">'+head('Start a conversation','PRIVATE ENQUIRIES')+'<div class="contact"><div><h2 class="display">Let’s talk<br><em>possibility.</em></h2><p class="copy">Artist representation, public relations, creative direction and select collaborations.</p><a class="link" href="mailto:'+mail+'">'+mail+' ↗</a></div><form id="enquiry"><div class="field"><label for="name">Name</label><input id="name" name="name" required></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div><div class="field"><label for="interest">Area of interest</label><select id="interest" name="interest"><option>Brand strategy</option><option>Public relations</option><option>Creative direction</option><option>Representation</option><option>Other enquiry</option></select></div><div class="field"><label for="message">Tell us about your project</label><textarea id="message" name="message" required></textarea></div><button class="button">Prepare enquiry ↗</button><p class="note">Opens your email application with your enquiry ready to send.</p></form></div></section>'
};
function render(){let path=location.hash.slice(1)||'/';let content=views[path];if(!content&&path.startsWith('/anatomy/')){const a=articles.find(x=>x.id===path.split('/')[2]);if(a)content='<article class="article shell"><a class="link" href="#/anatomy">← Back to the archive</a><p class="eyebrow" style="margin-top:80px">THE ANATOMY OF AN ERA / '+a.type+'</p><h1>'+a.name+'<br><em>'+a.title+'</em></h1><p class="stand">'+a.deck+'</p><hr>'+a.paragraphs.map((p,i)=>'<p>'+p+'</p>'+(i===1?'<blockquote>“'+a.quote+'”</blockquote>':'')).join('')+'<hr><p class="note">Independent analysis of publicly visible creative positioning. Not a client case study or disclosure of proprietary strategy.</p><a class="link" href="#/contact">Shape your own narrative ↗</a></article>'}app.innerHTML=content||'<section class="page-hero shell"><h1 class="display">Page not found.</h1><a href="#/">Return home ↗</a></section>';document.getElementById('year').textContent=new Date().getFullYear();document.querySelector('nav').classList.remove('open');const menu=document.querySelector('.menu');menu.textContent='+';menu.setAttribute('aria-expanded','false');menu.setAttribute('aria-label','Open navigation');const f=document.getElementById('enquiry');if(f)f.addEventListener('submit',e=>{e.preventDefault();const d=new FormData(f);location.href='mailto:'+mail+'?subject='+encodeURIComponent('THE IDENTITY OFFICE™ — '+d.get('interest')+' enquiry')+'&body='+encodeURIComponent('Name: '+d.get('name')+'\nEmail: '+d.get('email')+'\nInterest: '+d.get('interest')+'\n\n'+d.get('message'))});window.scrollTo(0,0)}
document.querySelector('.menu').onclick=()=>{const n=document.querySelector('nav');n.classList.toggle('open');const b=document.querySelector('.menu');b.setAttribute('aria-expanded',n.classList.contains('open'));b.setAttribute('aria-label',n.classList.contains('open')?'Close navigation':'Open navigation');b.textContent=n.classList.contains('open')?'×':'+'};window.addEventListener('hashchange',render);render();
</script></html>
